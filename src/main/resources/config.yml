# JapaneseChat configuration
# Changes take effect after /jp reload.

config-version: 2

# Message language: auto (each player's game language), en, ja
language: auto

kanji:
  # Convert the kana to kanji with Google Input Tools. This sends the kana of each converted message
  # to Google. When it is off, or Google does not answer in time, the kana are shown.
  enabled: true
  timeout-ms: 2000

# Added after the message. MiniMessage; <converted> is the conversion.
format: " <gray>(<converted>)"

# Defaults for players who have not chosen with /jp.
defaults:
  # Convert the player's own messages (/jp on, /jp off)
  convert: true
  # Show conversions of other players' messages (/jp view)
  view: true
