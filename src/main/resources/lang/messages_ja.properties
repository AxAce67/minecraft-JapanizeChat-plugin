# JapaneseChat のメッセージ（MiniMessage）。変更するときは
# plugins/JapaneseChat/lang/messages_ja.properties を作り、変えたいキーだけを書いてください。

error.no-permission=<red>権限がありません。
error.player-only=<red>プレイヤーのみ実行できます。
error.unknown=<red><white>{0}</white> というサブコマンドはありません。<yellow>/jp help</yellow> を見てください。

state.on=<green>オン</green>
state.off=<red>オフ</red>
status=<gray>自分の発言の変換: {0} <dark_gray>·</dark_gray> <gray>他の人の変換の表示: {1}

convert.on=<green>ローマ字の発言を変換します。
convert.off=<yellow>自分の発言を変換しないようにしました。
view.on=<green>他の人の発言の変換を表示します。
view.off=<yellow>他の人の発言の変換を表示しないようにしました。

test.result=<gray>{0} <dark_gray>→</dark_gray> <white>{1}</white> <dark_gray>（{2} ms）
test.none=<gray>{0} <dark_gray>→</dark_gray> <yellow>変換しません（ローマ字ではありません）

reload.done=<green>再読み込みしました。
reload.warnings=<yellow>再読み込みしました（警告 {0} 件、コンソールを確認してください）。

usage.test=<red>使い方: /jp test <文章>

help.header=<aqua>JapaneseChat</aqua> <gray>{0}
help.on=<yellow>/jp on</yellow> <gray>自分のローマ字の発言を変換する
help.off=<yellow>/jp off</yellow> <gray>自分の発言を変換しない
help.view=<yellow>/jp view [on|off]</yellow> <gray>他の人の変換を表示する・しない
help.test=<yellow>/jp test <文章></yellow> <gray>変換を試す
help.reload=<yellow>/jp reload</yellow> <gray>設定とメッセージを再読み込み
