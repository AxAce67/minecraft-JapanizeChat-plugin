# JapaneseChat messages (MiniMessage). To change a message, create
# plugins/JapaneseChat/lang/messages_en.properties with only the keys you want to override.

error.no-permission=<red>You do not have permission to do that.
error.player-only=<red>Only players can do that.
error.unknown=<red>Unknown subcommand <white>{0}</white>. See <yellow>/jp help</yellow>.

state.on=<green>on</green>
state.off=<red>off</red>
status=<gray>Convert your messages: {0} <dark_gray>·</dark_gray> <gray>Show others' conversions: {1}

convert.on=<green>Your romaji messages will be converted.
convert.off=<yellow>Your messages will no longer be converted.
view.on=<green>Conversions of other players' messages are shown.
view.off=<yellow>Conversions of other players' messages are hidden.

test.result=<gray>{0} <dark_gray>→</dark_gray> <white>{1}</white> <dark_gray>({2} ms)
test.none=<gray>{0} <dark_gray>→</dark_gray> <yellow>not converted (not romaji)

reload.done=<green>Reloaded.
reload.warnings=<yellow>Reloaded with {0} warning(s), see the console.

usage.test=<red>Usage: /jp test <text>

help.header=<aqua>JapaneseChat</aqua> <gray>{0}
help.on=<yellow>/jp on</yellow> <gray>Convert your romaji messages
help.off=<yellow>/jp off</yellow> <gray>Do not convert your messages
help.view=<yellow>/jp view [on|off]</yellow> <gray>Show or hide others' conversions
help.test=<yellow>/jp test <text></yellow> <gray>Try a conversion
help.reload=<yellow>/jp reload</yellow> <gray>Reload config and messages
