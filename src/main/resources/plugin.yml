name: JapaneseChat
version: '${version}'
main: sh.aki.japanesechat.JapaneseChatPlugin
api-version: '1.18'
description: Adds the Japanese reading of romaji chat messages, with optional kanji.
authors: [AxAce67]
website: https://github.com/AxAce67/JapaneseChat

commands:
  jp:
    description: JapaneseChat settings
    usage: /jp [on|off|view|help]
    aliases: [japanesechat]
    permission: japanesechat.use

permissions:
  japanesechat.use:
    description: Messages are converted, and /jp can be used.
    default: true
  japanesechat.admin:
    description: /jp test and /jp reload.
    default: op
    children:
      japanesechat.use: true
