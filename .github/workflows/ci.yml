name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: ./gradlew build --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: build/libs/*.jar

  # Starts a real Paper server per version, converts a 1.x config, runs the console commands
  # including test conversions. Each version runs on the Java it was made for.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { paper: "1.18.2", java: "17" }
          - { paper: "1.19.4", java: "17" }
          - { paper: "1.20.1", java: "17" }
          - { paper: "1.20.4", java: "17" }
          - { paper: "1.20.6", java: "21" }
          - { paper: "1.21.1", java: "21" }
          - { paper: "1.21.4", java: "21" }
          - { paper: "1.21.8", java: "21" }
          - { paper: "1.21.11", java: "21" }
          - { paper: "26.1.2", java: "25" }
          - { paper: "26.2", java: "25" }
          - { paper: "26.3", java: "25" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: build/libs
      - name: Smoke test Paper ${{ matrix.paper }} on Java ${{ matrix.java }}
        run: |
          JAVA_HOME_VAR="JAVA_HOME_${{ matrix.java }}_X64"
          export JAVA="${!JAVA_HOME_VAR}/bin/java"
          "$JAVA" -version
          scripts/smoke-test.sh "${{ matrix.paper }}"
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.paper }}
          path: run/smoke/${{ matrix.paper }}/server.log
